[project]
name = "agnostic-llm"
version = "0.1.0"
description = "Swap between Claude, GPT, Gemini, and local models without rewriting your app"
requires-python = ">=3.10"
dependencies = ["pyyaml", "starlette", "uvicorn"]

[project.scripts]
agnostic-ai = "agnostic_llm.cli:main"

[project.optional-dependencies]
anthropic = ["anthropic"]
openai = ["openai"]
all = ["anthropic", "openai"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agnostic_llm*"]
